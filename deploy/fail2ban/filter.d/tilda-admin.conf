[Definition]
# Caddy JSON access log. Only /admin and /admin/* endpoints with HTTP 401 count.
# remote_ip is the TCP peer and cannot be forged with X-Forwarded-For.
failregex = ^.*"request":\{"remote_ip":"<HOST>"[^}]*"method":"(?:GET|POST)"[^}]*"uri":"/admin(?:/[^"? ]*)?(?:\?[^" ]*)?"[^}]*\}.*"status":401(?:,|}).*$
ignoreregex =
datepattern = {NONE}

