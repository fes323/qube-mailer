services:
  prepare-keyring:
    build: .
    image: qube-webhook:local
    user: "0:0"
    command: ["/app/.venv/bin/python", "-m", "app.prepare_keyring"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    secrets:
      - queue_keyring
    volumes:
      - runtime-keyring:/runtime-keyring

  app:
    build: .
    image: qube-webhook:local
    env_file: .env
    depends_on:
      prepare-keyring:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - app-data:/data
      - runtime-keyring:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - security-logs:/var/log/caddy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "test", "-f", "/var/log/caddy/admin-access.log"]
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 5s

  fail2ban:
    image: crazymax/fail2ban:1.1.0
    restart: unless-stopped
    network_mode: host
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      F2B_LOG_TARGET: STDOUT
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 7d
      IPTABLES_MODE: auto
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/fail2ban:/data
      - security-logs:/var/log/caddy:ro

volumes:
  runtime-keyring:
  app-data:
  caddy-data:
  caddy-config:
  security-logs:

secrets:
  queue_keyring:
    file: ./secrets/queue-keyring.json
