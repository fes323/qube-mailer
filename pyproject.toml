[project]
name = "tilda-webhook-mailer"
version = "0.1.0"
description = "Privacy-first Tilda webhook to SMTP relay with a minimal admin panel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0,<51.0",
    "fastapi>=0.116.0,<1.0",
    "jinja2>=3.1.6,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0",
    "pytest>=8.4.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
